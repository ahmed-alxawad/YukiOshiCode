name: Installer smoke tests

# Releases are published with GITHUB_TOKEN, whose events do not trigger other workflows, so the
# release workflow starts this one with workflow_dispatch after publishing. It also runs whenever the
# install scripts change, because users run them straight from main: the scripts are tested from
# this checkout against the latest published release.
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [install, install.ps1, .github/workflows/installers.yml]
  pull_request:
    paths: [install, install.ps1, .github/workflows/installers.yml]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install YukiOshi Code
        shell: pwsh
        run: ./install.ps1

      - name: Verify installed version and built-in skills
        shell: pwsh
        run: |
          $expected = (gh release view --json tagName --jq '.tagName').Trim()
          $expected = $expected -replace '^v', ''
          $binary = Join-Path $env:USERPROFILE '.yukioshi\bin\yukioshi.exe'

          $versionLines = & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw "Installed binary failed --version with exit code $LASTEXITCODE"
          }
          $actual = ($versionLines -join "`n").Trim()
          if ($actual -ne $expected) {
            throw "Version mismatch: got '$actual', expected '$expected'"
          }

          $skillLines = & $binary debug skill
          if ($LASTEXITCODE -ne 0) {
            throw "Installed binary failed debug skill with exit code $LASTEXITCODE"
          }
          $skills = $skillLines -join "`n"
          if (-not $skills.Contains('"name": "nightmare"')) {
            throw "Expected debug skill output to contain the nightmare skill"
          }

      - name: Reinstall and verify backup
        shell: pwsh
        run: |
          ./install.ps1
          $backup = Join-Path $env:USERPROFILE '.yukioshi\bin\yukioshi.exe.old'
          if (-not (Test-Path -LiteralPath $backup -PathType Leaf)) {
            throw "Second install did not retain $backup"
          }

  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # Install the previous release first, so the second install is a real upgrade: the
      # installer skips a version that is already installed, and only an upgrade keeps a backup.
      - name: Install the previous release
        shell: bash
        run: |
          previous="$(gh release list --exclude-drafts --limit 2 --json tagName --jq '.[1].tagName')"
          echo "PREVIOUS_VERSION=${previous#v}" >> "$GITHUB_ENV"
          bash ./install --version "${previous#v}"

      - name: Upgrade to the latest release
        shell: bash
        run: bash ./install

      - name: Verify installed version, built-in skills, and backup
        shell: bash
        run: |
          expected="$(gh release view --json tagName --jq '.tagName')"
          expected="${expected#v}"
          binary="$HOME/.yukioshi/bin/yukioshi"

          actual="$("$binary" --version)"
          if [ "$actual" != "$expected" ]; then
            echo "Version mismatch: got '$actual', expected '$expected'" >&2
            exit 1
          fi

          skills="$("$binary" debug skill)"
          if ! grep -Fq '"name": "nightmare"' <<<"$skills"; then
            echo "Expected debug skill output to contain the nightmare skill" >&2
            exit 1
          fi

          backup="$HOME/.yukioshi/bin/yukioshi.old"
          if [ ! -f "$backup" ]; then
            echo "The upgrade did not keep $backup" >&2
            exit 1
          fi
          backup_version="$("$backup" --version)"
          if [ "$backup_version" != "$PREVIOUS_VERSION" ]; then
            echo "Backup is version '$backup_version', expected '$PREVIOUS_VERSION'" >&2
            exit 1
          fi
