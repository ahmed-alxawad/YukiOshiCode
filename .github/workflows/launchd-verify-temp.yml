name: Temporary macOS launchd verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-launchd:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build current YukiOshi
        working-directory: packages/opencode
        env:
          YUKIOSHI_CHANNEL: latest
          YUKIOSHI_VERSION: "0.3.5"
        run: bun run script/build.ts --single --skip-install --skip-embed-web-ui

      - name: Bootstrap a unique YukiOshi LaunchAgent
        run: |
          set -euo pipefail
          readonly verify_home="${HOME}/.yukioshi-launchd-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly agent_dir="${verify_home}/Library/LaunchAgents"
          readonly job_id="launchd_verify_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          readonly label="com.yukioshi.schedule.${job_id}"
          readonly plist_path="${agent_dir}/${label}.plist"
          readonly owner_file="${verify_home}/.ci-owned"

          case "${verify_home}" in
            "${HOME}"/.yukioshi-launchd-verify-*) ;;
            *) echo "Refusing a LaunchAgent path outside the runner home" >&2; exit 1 ;;
          esac
          if [ -e "${verify_home}" ] || [ -L "${verify_home}" ]; then
            echo "Refusing to reuse an existing verification directory: ${verify_home}" >&2
            exit 1
          fi

          mkdir -m 700 -- "${verify_home}"
          mkdir -m 700 -- "${verify_home}/Library"
          mkdir -m 700 -- "${agent_dir}"
          printf '%s\n' "${label}" > "${owner_file}"

          readonly binary="$(find "${GITHUB_WORKSPACE}/packages/opencode/dist" -type f -path '*/bin/yukioshi' -print -quit)"
          test -n "${binary}"
          test -x "${binary}"
          "${binary}" --version

          export YUKIOSHI_LAUNCHD_VERIFY_ID="${job_id}"
          export YUKIOSHI_LAUNCHD_VERIFY_BINARY="${binary}"
          export YUKIOSHI_LAUNCHD_VERIFY_HOME="${verify_home}"
          export YUKIOSHI_LAUNCHD_VERIFY_DIRECTORY="${GITHUB_WORKSPACE}"
          bun --eval '
            import { syncLaunchdSchedule } from "./packages/opencode/src/schedule/launchd.ts"

            const required = (name) => {
              const value = process.env[name]
              if (!value) throw new Error(`Missing ${name}`)
              return value
            }

            const id = required("YUKIOSHI_LAUNCHD_VERIFY_ID")
            await syncLaunchdSchedule(
              [
                {
                  id,
                  name: "Temporary macOS launchd verification",
                  cron: "0 0 1 1 *",
                  prompt: "Temporary CI verification only",
                  directory: required("YUKIOSHI_LAUNCHD_VERIFY_DIRECTORY"),
                  auto: false,
                  enabled: true,
                  createdAt: Date.now(),
                },
              ],
              {
                binary: required("YUKIOSHI_LAUNCHD_VERIFY_BINARY"),
                home: required("YUKIOSHI_LAUNCHD_VERIFY_HOME"),
                pathEnv: process.env.PATH ?? "",
                env: {},
              },
            )
            console.log(`Bootstrapped ${id} through YukiOshi syncLaunchdSchedule`)
          '

          test -f "${plist_path}"
          test ! -L "${plist_path}"
          plutil -lint "${plist_path}"
          stat -f '%Sp %N' "${plist_path}"
          printf 'YUKIOSHI_LAUNCHD_BOOTSTRAPPED=true\n' >> "${GITHUB_ENV}"
          {
            echo "## Temporary launchd verification"
            echo
            echo "- Label: \`${label}\`"
            echo "- Plist: \`${plist_path}\`"
            echo "- Binary: \`${binary}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Print loaded LaunchAgent status
        run: |
          set -euo pipefail
          readonly verify_home="${HOME}/.yukioshi-launchd-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly job_id="launchd_verify_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          readonly label="com.yukioshi.schedule.${job_id}"
          readonly plist_path="${verify_home}/Library/LaunchAgents/${label}.plist"
          readonly uid="$(id -u)"

          test -f "${plist_path}"
          echo '::group::launchctl print'
          launchctl print "gui/${uid}/${label}"
          echo '::endgroup::'
          echo '::group::launchctl list'
          launchctl list "${label}"
          echo '::endgroup::'

      - name: Boot out and remove the temporary LaunchAgent
        if: always()
        run: |
          set -u
          readonly verify_home="${HOME}/.yukioshi-launchd-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly agent_dir="${verify_home}/Library/LaunchAgents"
          readonly job_id="launchd_verify_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          readonly label="com.yukioshi.schedule.${job_id}"
          readonly plist_path="${agent_dir}/${label}.plist"
          readonly owner_file="${verify_home}/.ci-owned"
          readonly uid="$(id -u)"

          case "${verify_home}" in
            "${HOME}"/.yukioshi-launchd-verify-*) ;;
            *) echo "Refusing a LaunchAgent path outside the runner home" >&2; exit 1 ;;
          esac
          if [ ! -f "${owner_file}" ] || [ "$(cat "${owner_file}")" != "${label}" ]; then
            echo "No owned temporary LaunchAgent directory to clean."
            exit 0
          fi
          if [ -L "${plist_path}" ]; then
            echo "Refusing to remove an unexpected symbolic-link plist: ${plist_path}" >&2
            exit 1
          fi

          cleanup_status=0
          if [ "${YUKIOSHI_LAUNCHD_BOOTSTRAPPED:-false}" = true ]; then
            launchctl bootout "gui/${uid}" "${plist_path}" || cleanup_status=$?
          else
            launchctl bootout "gui/${uid}" "${plist_path}" || true
          fi
          if [ -e "${plist_path}" ]; then
            rm -f -- "${plist_path}"
          fi
          if [ -e "${plist_path}" ] || [ -L "${plist_path}" ]; then
            echo "Temporary LaunchAgent plist remains: ${plist_path}" >&2
            cleanup_status=1
          fi

          rm -f -- "${owner_file}"
          rmdir -- "${agent_dir}" 2>/dev/null || true
          rmdir -- "${verify_home}/Library" 2>/dev/null || true
          rmdir -- "${verify_home}" 2>/dev/null || true
          if [ "${cleanup_status}" -ne 0 ]; then
            exit "${cleanup_status}"
          fi
          echo "Booted out and removed ${label} at ${plist_path}"
