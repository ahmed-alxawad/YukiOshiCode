name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun packages/opencode/script/check-docs.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
          - tui
          - sandbox
          - opencode-session
          - opencode-server
          - opencode-cli
          - opencode-tool
          - opencode-provider
          - opencode-config
          - opencode-rest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Configure Git identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
      - run: bun install --frozen-lockfile
      # The sandbox tests run real bubblewrap; Ubuntu 24.04 also restricts the unprivileged user
      # namespaces it needs unless AppArmor's restriction is lifted.
      - name: Install bubblewrap for sandbox tests
        if: matrix.group == 'opencode-tool' || matrix.group == 'sandbox'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run ${{ matrix.group }} tests
        shell: bash
        run: |
          case "${{ matrix.group }}" in
            core)
              cd packages/core
              bun test
              ;;
            tui)
              cd packages/tui
              bun test
              ;;
            sandbox)
              cd packages/sandbox
              bun test
              ;;
            opencode-session|opencode-server|opencode-cli|opencode-tool|opencode-provider|opencode-config)
              group="${{ matrix.group }}"
              cd packages/opencode
              bun test "test/${group#opencode-}"
              ;;
            opencode-rest)
              cd packages/opencode
              mapfile -t tests < <(
                find test -mindepth 1 -maxdepth 1 \( -type d -o -type f -name '*.test.*' \) -printf '%f\n' |
                  sort |
                  while IFS= read -r entry; do
                    case "$entry" in
                      fake|fixtures|lib|session|server|cli|tool|provider|config) ;;
                      *) printf 'test/%s\n' "$entry" ;;
                    esac
                  done
              )
              if [ "${#tests[@]}" -eq 0 ]; then
                echo "No opencode remainder tests found" >&2
                exit 1
              fi
              printf 'Running remainder tests:\n%s\n' "${tests[*]}"
              bun test "${tests[@]}"
              ;;
          esac

  security-regression:
    name: security regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Configure Git identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
      - run: bun install --frozen-lockfile
      # Drives the real CLI (from source, nothing is built) through the attack scenarios fixed in
      # v0.3.6. Each file is an independent area, so they run side by side to keep the job short.
      - name: Run the security scenarios
        working-directory: packages/opencode
        shell: bash
        run: |
          set -u
          logs="$RUNNER_TEMP/security"
          mkdir -p "$logs"
          files=(test/e2e/security/*.e2e.test.ts)
          pids=()
          for file in "${files[@]}"; do
            name="$(basename "$file" .e2e.test.ts)"
            bun test --timeout 240000 "$file" > "$logs/$name.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for i in "${!pids[@]}"; do
            name="$(basename "${files[$i]}" .e2e.test.ts)"
            if wait "${pids[$i]}"; then result=passed; else result=FAILED; status=1; fi
            echo "::group::security/$name ($result)"
            cat "$logs/$name.log"
            echo "::endgroup::"
          done
          exit "$status"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build native binary and smoke test it
        working-directory: packages/opencode
        env:
          YUKIOSHI_CHANNEL: ci
          YUKIOSHI_VERSION: 0.0.0-ci
        run: bun run script/build.ts --single --skip-embed-web-ui --skip-install
      - name: Check the binary carries the built-in skills
        working-directory: packages/opencode
        run: |
          home="$(mktemp -d)"
          HOME="$home" XDG_CACHE_HOME="$home/cache" XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" \
            ./dist/yukioshi-linux-x64/bin/yukioshi debug skill > skills.json
          grep -q '"name": "engineering:code-review"' skills.json
          grep -q '"name": "nightmare"' skills.json

  binary-smoke:
    name: binary smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build native binary
        working-directory: packages/opencode
        run: bun run script/build.ts --single --skip-embed-web-ui
      - name: Run release smoke tests
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) BIN="./packages/opencode/dist/yukioshi-linux-x64/bin/yukioshi" ;;
            macOS) BIN="./packages/opencode/dist/yukioshi-darwin-arm64/bin/yukioshi" ;;
            Windows) BIN="./packages/opencode/dist/yukioshi-windows-x64/bin/yukioshi.exe" ;;
            *) echo "Unsupported runner: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          bun packages/opencode/script/smoke.ts "$BIN"
