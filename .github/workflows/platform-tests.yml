name: Platform Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Configure Git identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run platform feature tests
        working-directory: packages/opencode
        run: |
          bun test \
            test/cli/import-transcripts.test.ts \
            test/cli/skill-install.test.ts \
            test/cli/plugin-claude.test.ts \
            test/server/trigger.test.ts \
            test/audit/audit-security.test.ts \
            test/cli/run/outcome.test.ts \
            test/permission/review.test.ts
