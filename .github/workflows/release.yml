name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Draft first so `releases/latest` never points at a release without binaries.
      - name: Create draft release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; re-uploading binaries."
            exit 0
          fi
          cat > notes.md <<EOF
          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/install | bash
          \`\`\`

          Or download the archive for your platform below, extract it, and put \`yukioshi\` on your \`PATH\`.
          Already installed? Run \`yukioshi upgrade\`.
          EOF
          gh release create "$TAG" --draft --title "YukiOshi Code $TAG" --notes-file notes.md

      - name: Build and upload binaries
        working-directory: packages/opencode
        env:
          YUKIOSHI_CHANNEL: latest
          YUKIOSHI_RELEASE: "1"
        run: |
          export YUKIOSHI_VERSION="${TAG#v}"
          bun run script/build.ts --skip-embed-web-ui

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --latest
