name: Full Suite Platforms

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-suite-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: full-suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Configure Git identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run opencode test suite
        id: test
        continue-on-error: true
        working-directory: packages/opencode
        run: |
          bun test --timeout 30000 2>&1 | tee test-output.log

      - name: Print failing tests in job summary
        if: always()
        working-directory: packages/opencode
        run: |
          bun -e '
            import fs from "node:fs";
            const logPath = "test-output.log";
            if (!fs.existsSync(logPath)) {
              console.log("No test-output.log found");
              process.exit(0);
            }
            const content = fs.readFileSync(logPath, "utf8");
            const clean = content.replace(/\x1B\[[0-9;]*[a-zA-Z]/g, "");
            const lines = clean.split("\n");
            let currentFile = "unknown";
            const failures = [];
            let passCount = 0;
            let failCount = 0;
            let totalLine = "";

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith("Ran ") && trimmed.includes("tests across")) {
                totalLine = trimmed;
                break;
              }
              const fileMatch = trimmed.match(/^(?:##\[group\]|::group::)?([^\s:]+\.test\.[a-z]+):?$/i);
              if (fileMatch) {
                currentFile = fileMatch[1];
                continue;
              }
              const failMatch = trimmed.match(/^(?:✗|\(fail\))\s+(.*?)(?:\s+\[[\d\.]+m?s\])?$/);
              if (failMatch) {
                const testName = failMatch[1];
                failures.push({ file: currentFile, test: testName });
                continue;
              }
              if (trimmed.includes("Unhandled error between tests")) {
                failures.push({ file: currentFile, test: "(unhandled error in test file)" });
                continue;
              }
              if (trimmed.endsWith("pass")) {
                const m = trimmed.match(/^(\d+)\s+pass$/);
                if (m) passCount = parseInt(m[1], 10);
              }
              if (trimmed.endsWith("fail")) {
                const m = trimmed.match(/^(\d+)\s+fail$/);
                if (m) failCount = parseInt(m[1], 10);
              }
            }

            let summary = "## Test Results (" + (process.env.RUNNER_OS || "Platform") + ")\n\n";
            if (totalLine) {
              summary += "**Summary:** " + passCount + " passed, " + failCount + " failed. " + totalLine + "\n\n";
            } else {
              summary += "**Summary:** " + passCount + " passed, " + failCount + " failed.\n\n";
            }

            if (failures.length === 0) {
              summary += "### All tests passed!\n";
            } else {
              summary += "### Failing Tests (" + failures.length + ")\n\n";
              summary += "| # | File | Test Name |\n";
              summary += "| - | --- | --- |\n";
              failures.forEach((f, i) => {
                const safeTest = f.test.replace(/\|/g, "\\|");
                summary += "| " + (i + 1) + " | `" + f.file + "` | " + safeTest + " |\n";
              });
            }

            console.log(summary);
            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            if (summaryFile) {
              fs.appendFileSync(summaryFile, summary + "\n", "utf8");
            }
          '

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: packages/opencode/test-output.log
