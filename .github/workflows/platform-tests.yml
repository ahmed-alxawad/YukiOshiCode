name: Platform Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Configure Git identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --no-progress

      - name: Run platform feature tests
        working-directory: packages/opencode
        run: |
          bun test \
            test/cli/import-transcripts.test.ts \
            test/cli/skill-install.test.ts \
            test/cli/plugin-claude.test.ts \
            test/server/trigger.test.ts \
            test/audit/audit-security.test.ts \
            test/cli/run/outcome.test.ts \
            test/permission/review.test.ts \
            test/schedule/ \
            test/delegate/in-cwd.test.ts \
            test/delegate/spawn-windows.test.ts \
            test/project/worktree-paths.test.ts \
            test/hooks/timeout-group.test.ts \
            test/platform/windows-verification.test.ts \
            test/cli/trust.test.ts \
            test/e2e/audit.e2e.test.ts \
            test/e2e/import.e2e.test.ts \
            test/e2e/trigger.e2e.test.ts \
            test/e2e/untrusted-repository.e2e.test.ts \
            test/hooks/runner.test.ts \
            test/server/httpapi-file.test.ts \
            test/server/session-messages.test.ts \
            test/session/prompt.test.ts \
            test/server/httpapi-v2-pty.test.ts \
            test/tool/shell.test.ts \
            ../sandbox/test/platform-case.test.ts \
            ../core/test/global.test.ts

