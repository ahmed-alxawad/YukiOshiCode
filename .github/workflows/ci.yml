name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - core
          - tui
          - sandbox
          - opencode-session
          - opencode-server
          - opencode-cli
          - opencode-tool
          - opencode-provider
          - opencode-config
          - opencode-rest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Configure Git identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
      - run: bun install --frozen-lockfile
      # The sandbox tests run real bubblewrap; Ubuntu 24.04 also restricts the unprivileged user
      # namespaces it needs unless AppArmor's restriction is lifted.
      - name: Install bubblewrap for sandbox tests
        if: matrix.group == 'opencode-tool' || matrix.group == 'sandbox'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run ${{ matrix.group }} tests
        shell: bash
        run: |
          case "${{ matrix.group }}" in
            core)
              cd packages/core
              bun test
              ;;
            tui)
              cd packages/tui
              bun test
              ;;
            sandbox)
              cd packages/sandbox
              bun test
              ;;
            opencode-session|opencode-server|opencode-cli|opencode-tool|opencode-provider|opencode-config)
              group="${{ matrix.group }}"
              cd packages/opencode
              bun test "test/${group#opencode-}"
              ;;
            opencode-rest)
              cd packages/opencode
              mapfile -t tests < <(
                find test -mindepth 1 -maxdepth 1 \( -type d -o -type f -name '*.test.*' \) -printf '%f\n' |
                  sort |
                  while IFS= read -r entry; do
                    case "$entry" in
                      fake|fixtures|lib|session|server|cli|tool|provider|config) ;;
                      *) printf 'test/%s\n' "$entry" ;;
                    esac
                  done
              )
              if [ "${#tests[@]}" -eq 0 ]; then
                echo "No opencode remainder tests found" >&2
                exit 1
              fi
              printf 'Running remainder tests:\n%s\n' "${tests[*]}"
              bun test "${tests[@]}"
              ;;
          esac

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build native binary and smoke test it
        working-directory: packages/opencode
        env:
          YUKIOSHI_CHANNEL: ci
          YUKIOSHI_VERSION: 0.0.0-ci
        run: bun run script/build.ts --single --skip-embed-web-ui --skip-install
      - name: Check the binary carries the built-in skills
        working-directory: packages/opencode
        run: |
          home="$(mktemp -d)"
          HOME="$home" XDG_CACHE_HOME="$home/cache" XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" \
            ./dist/yukioshi-linux-x64/bin/yukioshi debug skill > skills.json
          grep -q '"name": "engineering:code-review"' skills.json
          grep -q '"name": "nightmare"' skills.json
